<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio de la Ciudad · FM 103.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-0:#070F18;
    --navy-1:#0B1721;
    --navy-2:#0F2029;
    --navy-3:#142A35;
    --card:#16303B;
    --card-2:#1B3944;
    --petrol:#0E7C8C;
    --petrol-light:#3FC3D3;
    --ice:#9FE8EF;
    --paper:#E6EEF1;
    --muted:#8AA3AC;
    --white:#FFFFFF;
    --line:rgba(255,255,255,0.1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Manrope', sans-serif;
    background:var(--navy-1);
    color:var(--paper);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  img{max-width:100%; display:block;}
  a{color:inherit; text-decoration:none;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  .serif{font-family:'Fraunces', serif;}
  .wrap{max-width:1180px; margin:0 auto; padding:0 32px;}
  ::selection{background:var(--petrol-light); color:var(--navy-0);}

  .reveal{opacity:0; transform:translateY(24px); transition:opacity .8s ease, transform .8s ease;}
  .reveal.in-view{opacity:1; transform:translateY(0);}

  /* ---------- nav ---------- */
  header.nav{
    position:fixed; top:0; left:0; right:0; z-index:100; padding:20px 0;
    background:transparent; transition:background .35s ease, padding .35s ease, border-color .35s ease;
    border-bottom:1px solid transparent;
  }
  header.nav.scrolled{
    background:rgba(7,15,24,0.92); backdrop-filter:blur(10px); padding:14px 0; border-bottom:1px solid var(--line);
  }
  .nav-inner{display:flex; align-items:center; justify-content:space-between; gap:24px;}
  .brand{display:flex; align-items:center; gap:11px;}
  .brand-equalizer{display:flex; align-items:center; justify-content:center; gap:3px; width:47px; height:48px; color:var(--white);}
  .brand-equalizer span{display:block; width:3px; height:100%; background:currentColor; border-radius:2px; transform-origin:center; animation:brandEqualize var(--bar-speed) ease-in-out infinite; animation-delay:var(--bar-delay);}
  .brand-equalizer span:nth-child(1){--bar-speed:1.1s; --bar-delay:.1s;}
  .brand-equalizer span:nth-child(2){--bar-speed:.9s; --bar-delay:.3s;}
  .brand-equalizer span:nth-child(3){--bar-speed:1.3s; --bar-delay:.2s;}
  .brand-equalizer span:nth-child(4){--bar-speed:1s; --bar-delay:.4s;}
  .brand-equalizer span:nth-child(5){--bar-speed:1.4s; --bar-delay:.1s;}
  .brand-equalizer span:nth-child(6){--bar-speed:.8s; --bar-delay:.5s;}
  .brand-equalizer span:nth-child(7){--bar-speed:1.2s; --bar-delay:.2s;}
  .brand-equalizer span:nth-child(8){--bar-speed:1.1s; --bar-delay:.4s;}
  .brand-equalizer span:nth-child(9){--bar-speed:.9s; --bar-delay:.1s;}
  .brand-equalizer span:nth-child(10){--bar-speed:1.3s; --bar-delay:.3s;}
  @keyframes brandEqualize{0%,100%{transform:scaleY(.2);} 50%{transform:scaleY(1);}}
  .brand-text{display:flex; flex-direction:column; width:136px; line-height:1; white-space:nowrap;}
  .brand-text .freq{order:-1; font-family:'Manrope', sans-serif; font-size:30px; font-weight:800; color:var(--white); letter-spacing:-1.8px;}
  .brand-text .freq b{font-size:.75em; letter-spacing:-.8px;}
  .brand-text .name{display:block; width:100%; margin-top:5px; font-family:'Manrope', sans-serif; font-weight:800; font-size:9px; color:var(--white); letter-spacing:.85px; text-align:justify; text-align-last:justify;}
  nav.links{display:flex; align-items:center; gap:34px;}
  nav.links a{color:rgba(230,238,241,0.72); font-size:14px; font-weight:600; letter-spacing:.3px; position:relative; padding:4px 0;}
  nav.links a:hover{color:var(--white);}
  nav.links a::after{content:''; position:absolute; left:0; bottom:-2px; width:0; height:1px; background:var(--petrol-light); transition:width .25s ease;}
  nav.links a:hover::after{width:100%;}
  .onair-pill{
    display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:999px; padding:7px 14px;
    background:transparent; cursor:pointer; font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:1.5px; color:var(--ice);
  }
  .onair-pill:hover{border-color:var(--petrol-light); background:rgba(63,195,211,.08);}
  .onair-pill:focus-visible{outline:2px solid var(--ice); outline-offset:3px;}
  .onair-dot{width:7px; height:7px; border-radius:50%; background:var(--petrol-light); box-shadow:0 0 0 0 rgba(63,195,211,.6); animation:pulseDot 1.8s infinite;}
  @keyframes pulseDot{
    0%{box-shadow:0 0 0 0 rgba(63,195,211,.55);} 70%{box-shadow:0 0 0 8px rgba(63,195,211,0);} 100%{box-shadow:0 0 0 0 rgba(63,195,211,0);}
  }
  .mini-player{position:fixed; left:50%; bottom:22px; z-index:200; display:flex; align-items:center; gap:18px; width:min(520px, calc(100vw - 32px)); padding:12px 14px 12px 18px; border:1px solid rgba(159,232,239,.26); border-radius:12px; background:rgba(11,23,33,.94); box-shadow:0 20px 50px rgba(0,0,0,.42); backdrop-filter:blur(14px); transform:translate(-50%, calc(100% + 30px)); opacity:0; pointer-events:none; transition:transform .35s ease, opacity .25s ease;}
  .mini-player.show{transform:translate(-50%, 0); opacity:1; pointer-events:auto;}
  .mini-player:not(.is-playing) .onair-dot{animation:none; opacity:.45;}
  .mini-station{display:flex; align-items:center; gap:9px; min-width:0; flex:1;}
  .mini-copy{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .mini-copy .live{font-family:'IBM Plex Mono', monospace; font-size:10px; font-weight:600; letter-spacing:1.3px; color:var(--ice);}
  .mini-copy .title{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; font-weight:700; color:var(--white);}
  .mini-toggle{width:36px; height:36px; flex:0 0 36px; border:1px solid rgba(159,232,239,.28); border-radius:50%; background:var(--petrol); color:var(--white); cursor:pointer; font-size:14px; line-height:1; transition:background .2s ease, transform .2s ease;}
  .mini-toggle:hover{background:var(--petrol-light); color:var(--navy-0); transform:scale(1.06);}
  .mini-volume{display:flex; align-items:center; gap:8px; color:var(--ice);}
  .mini-volume svg{width:16px; height:16px; flex:0 0 16px;}
  .mini-volume input{width:94px; accent-color:var(--petrol-light); cursor:pointer;}
  .whatsapp-float{position:fixed; right:24px; bottom:98px; z-index:201; display:flex; align-items:center; justify-content:center; width:56px; height:56px; border-radius:50%; background:#25D366; color:#fff; box-shadow:0 12px 28px rgba(0,0,0,.32); transition:transform .2s ease, box-shadow .2s ease;}
  .whatsapp-float:hover{transform:translateY(-3px) scale(1.04); box-shadow:0 16px 32px rgba(37,211,102,.28);}
  .whatsapp-float:focus-visible{outline:3px solid var(--ice); outline-offset:3px;}
  .whatsapp-float svg{width:28px; height:28px; fill:currentColor;}
  .burger{display:none; flex-direction:column; gap:5px; cursor:pointer; z-index:110;}
  .burger span{width:24px; height:2px; background:var(--white); display:block;}

  /* ---------- hero ---------- */
  .hero{
    position:relative; background:radial-gradient(1200px 700px at 80% -10%, #123444 0%, var(--navy-0) 55%), var(--navy-0);
    color:var(--white); padding:168px 0 0; overflow:hidden;
  }
  .hero-watermark{
    position:absolute; top:38%; right:-40px; transform:translateY(-50%);
    font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:min(30vw, 340px);
    color:rgba(159,232,239,0.035); letter-spacing:-6px; pointer-events:none; user-select:none; white-space:nowrap;
  }
  .hero-grid{display:grid; grid-template-columns:1.15fr 0.85fr; gap:56px; align-items:center; position:relative; z-index:2; padding-bottom:64px;}
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:2.5px; text-transform:uppercase;
    color:var(--ice); display:flex; align-items:center; gap:10px; margin-bottom:22px;
  }
  .eyebrow::before{content:''; width:22px; height:1px; background:var(--ice);}
  .hero h1{font-family:'Fraunces', serif; font-weight:500; font-size:clamp(38px, 5.4vw, 64px); line-height:1.06; letter-spacing:-.5px; max-width:640px;}
  .hero h1 em{font-style:italic; font-weight:400; color:var(--ice);}
  .hero p.lead{margin-top:24px; font-size:17px; line-height:1.65; color:rgba(230,238,241,0.7); max-width:480px;}
  .btn-row{display:flex; gap:16px; margin-top:38px; flex-wrap:wrap;}
  .btn{
    display:inline-flex; align-items:center; gap:10px; padding:15px 26px; font-weight:700; font-size:14.5px;
    border-radius:2px; cursor:pointer; border:1px solid transparent; transition:transform .2s ease, background .2s ease, border-color .2s ease;
    letter-spacing:.2px;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn-petrol{background:var(--petrol); color:var(--white);}
  .btn-petrol:hover{background:var(--petrol-light); color:var(--navy-0);}
  .btn-ghost{border-color:rgba(230,238,241,0.3); color:var(--white);}
  .btn-ghost:hover{border-color:var(--white); background:rgba(255,255,255,0.06);}
  .btn-card{background:var(--card-2); color:var(--white);}
  .btn-card:hover{background:var(--petrol);}

  /* player card */
  .dial-wrap{display:flex; justify-content:center;}
  .dial-card{
    background:linear-gradient(160deg, var(--card-2), var(--card)); border:1px solid var(--line); border-radius:6px; padding:28px 26px 24px;
    box-shadow:0 30px 70px -20px rgba(0,0,0,0.6); width:100%; max-width:400px;
  }
  .dial-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .dial-top .label{font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:2px; color:var(--muted);}
  .live-badge{
    display:flex; align-items:center; gap:7px; background:rgba(63,195,211,0.12); color:var(--ice);
    border:1px solid rgba(63,195,211,0.35); border-radius:999px; padding:5px 12px; font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:1.5px;
  }

  .dial-stage{position:relative; width:100%; aspect-ratio:1/1; margin:0 auto;}
  .tuner-svg{width:100%; height:100%; overflow:visible;}
  .dial-ring-outer{fill:none; stroke:var(--line); stroke-width:1;}
  .dial-ring-inner{fill:none; stroke:rgba(255,255,255,0.06); stroke-width:1;}
  .dial-tick{stroke:rgba(230,238,241,0.28); stroke-width:2; stroke-linecap:round;}
  .dial-tick.major{stroke:rgba(230,238,241,0.5); stroke-width:2.5;}
  .dial-tick.active{stroke:var(--ice); stroke-width:4; filter:drop-shadow(0 0 6px rgba(159,232,239,0.85));}
  .radial-bar{stroke:var(--petrol-light); stroke-width:3; stroke-linecap:round; transform-origin:200px 200px; animation:radialPulse ease-in-out infinite;}
  @keyframes radialPulse{0%,100%{opacity:.22;} 50%{opacity:1;}}
  .dial-num{fill:var(--muted); font-family:'IBM Plex Mono', monospace; font-size:13px; text-anchor:middle; dominant-baseline:middle;}
  .dial-num.active{fill:var(--ice); font-weight:700; font-size:15px;}
  .needle-group{transform-origin:200px 200px; transform:rotate(-135deg); transition:transform 1.9s cubic-bezier(.16,1.4,.3,1);}
  .needle-group.tuned{transform:rotate(74.25deg);}
  .needle{stroke:var(--ice); stroke-width:3; stroke-linecap:round; filter:drop-shadow(0 0 8px rgba(159,232,239,0.7));}
  .needle-hub{fill:var(--navy-0); stroke:var(--ice); stroke-width:2.5;}
  .dial-center{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .dial-freq{font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:clamp(30px,7vw,40px); color:var(--white); letter-spacing:-1px;}
  .dial-sub{font-size:11px; color:var(--muted); letter-spacing:2px; margin-top:2px;}

  .station-line{display:flex; align-items:center; justify-content:space-between; padding-top:20px; margin-top:6px; border-top:1px solid var(--line);}
  .dial-station-name{font-family:'Fraunces', serif; font-size:15px; color:var(--white); font-weight:500;}
  .station-line .city{font-size:12.5px; color:rgba(230,238,241,0.6); text-align:right; line-height:1.4;}

  /* ---------- section shell ---------- */
  section{position:relative;}
  .section-pad{padding:110px 0;}
  .section-head{max-width:640px; margin-bottom:56px;}
  .section-head h2{font-family:'Fraunces', serif; font-weight:500; font-size:clamp(30px, 3.6vw, 44px); line-height:1.14; letter-spacing:-.3px; color:var(--white);}
  .section-head p{margin-top:16px; font-size:16.5px; line-height:1.7; color:var(--muted);}

  /* ---------- about ---------- */
  .about{background:var(--navy-2);}
  .about-grid{display:grid; grid-template-columns:0.9fr 1.1fr; gap:70px;}
  .about-copy p{font-size:16.5px; line-height:1.75; color:var(--muted); margin-bottom:18px;}
  .about-copy strong{color:var(--white); font-weight:700;}
  .about-copy .purpose-tag{
    display:inline-flex; margin-top:8px; font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:1.5px;
    color:var(--ice); border:1px solid rgba(159,232,239,0.3); border-radius:999px; padding:7px 14px;
  }

  .about-cta{margin-top:38px; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:26px 28px; display:flex; flex-direction:column; gap:16px;}
  .about-cta .t{font-family:'Fraunces', serif; font-size:18px; color:var(--white); font-weight:500;}
  .about-cta .d{font-size:14px; color:var(--muted); line-height:1.6;}
  .about-cta .links{display:flex; gap:12px; flex-wrap:wrap; margin-top:4px;}
  .about-cta .links a{
    display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--paper);
    border:1px solid var(--line); border-radius:999px; padding:9px 16px; transition:all .2s ease;
  }
  .about-cta .links a:hover{background:var(--petrol); color:var(--white); border-color:var(--petrol);}
  .about-cta .links a svg{width:15px; height:15px;}

  .journey{border-left:1px solid var(--line); padding-left:36px; display:flex; flex-direction:column; gap:34px;}
  .journey-item{position:relative;}
  .journey-item::before{content:''; position:absolute; left:-41px; top:4px; width:9px; height:9px; border-radius:50%; background:var(--navy-2); border:2px solid var(--petrol-light);}
  .journey-item .jnum{font-family:'IBM Plex Mono', monospace; font-size:18px; line-height:1; color:var(--ice); letter-spacing:1.5px; font-weight:700;}
  .journey-item h3{font-family:'Fraunces', serif; font-weight:500; font-size:21px; margin-top:6px; color:var(--white);}
  .journey-item .verse{
    font-size:13px; color:var(--petrol-light); margin-top:5px; font-style:italic; cursor:help;
    display:inline-flex; align-items:center; gap:5px; border-bottom:1px dotted var(--petrol-light); padding-bottom:1px;
  }
  .journey-item .verse:hover{color:var(--ice);}
  .journey-item .verse::after{content:'✦'; font-size:9px; position:relative; top:-4px; color:var(--ice);}

  /* verse popover */
  .verse-popover{
    position:fixed; z-index:300; max-width:300px; background:var(--card); color:var(--white);
    border-radius:6px; padding:18px 20px; box-shadow:0 24px 50px -14px rgba(0,0,0,0.6);
    opacity:0; transform:translateY(6px); pointer-events:none; transition:opacity .18s ease, transform .18s ease;
    border:1px solid var(--line);
  }
  .verse-popover.show{opacity:1; transform:translateY(0); pointer-events:auto;}
  .verse-popover .vp-ref{font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:1.5px; color:var(--ice); margin-bottom:8px;}
  .verse-popover .vp-text{font-family:'Fraunces', serif; font-size:15px; line-height:1.5; font-weight:400; color:var(--paper);}
  .verse-popover .vp-link{
    display:inline-flex; align-items:center; gap:5px; margin-top:12px; font-family:'IBM Plex Mono', monospace;
    font-size:10.5px; letter-spacing:1px; color:var(--ice); border-top:1px solid var(--line); padding-top:10px; width:100%;
  }

  /* ---------- app section ---------- */
  .app-sec{background:linear-gradient(180deg, var(--navy-3), var(--navy-2)); color:var(--white);}
  .app-grid{display:grid; grid-template-columns:1fr auto; gap:60px; align-items:center;}
  .app-copy p{font-size:16.5px; line-height:1.75; color:var(--muted); max-width:460px;}
  .app-feat{display:flex; gap:26px; margin-top:30px; flex-wrap:wrap;}
  .app-feat div{font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:1px; color:var(--ice); border-top:1px solid var(--line); padding-top:10px; width:120px;}
  .play-card{
    background:var(--card); border:1px solid var(--line); border-radius:6px; padding:22px; text-align:center; width:210px;
    box-shadow:0 30px 60px -18px rgba(0,0,0,0.5); display:flex; flex-direction:column; gap:16px; align-items:flex-start; text-align:left;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .play-card:hover{transform:translateY(-3px);}
  .play-card .play-icon{width:46px; height:46px; border-radius:11px; background:var(--navy-0); display:flex; align-items:center; justify-content:center;}
  .play-card .play-icon svg{width:22px; height:22px;}
  .play-card .top{font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:1px; color:var(--muted);}
  .play-card .bottom{font-family:'Fraunces', serif; font-size:19px; font-weight:600; color:var(--white); margin-top:2px;}
  .play-card .play-cta{
    display:flex; align-items:center; justify-content:space-between; width:100%; font-size:12.5px; font-weight:700; color:var(--ice);
    border-top:1px solid var(--line); padding-top:14px;
  }

  /* ---------- schedule ---------- */
  .schedule{background:var(--navy-1);}
  .schedule-grid{display:grid; grid-template-columns:1.1fr 0.9fr; gap:60px; align-items:center;}
  .clock-badge{
    width:220px; height:220px; border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    flex-direction:column; margin:0 auto; background:var(--navy-2); position:relative;
  }
  .clock-badge::before{content:''; position:absolute; inset:14px; border-radius:50%; border:1px dashed rgba(159,232,239,0.25);}
  .clock-badge .big{font-family:'Fraunces', serif; font-size:52px; font-weight:600; color:var(--white);}
  .clock-badge .cap{font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:2px; color:var(--ice); margin-top:4px;}
  .schedule-list{margin-top:26px; display:flex; flex-direction:column;}
  .schedule-list div{display:flex; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--line); font-size:14.5px; color:var(--muted);}
  .schedule-list div span:first-child{color:var(--white); font-weight:600;}
  .schedule-list div span:last-child{font-family:'IBM Plex Mono', monospace; font-size:12.5px;}

  /* ---------- proximamente ---------- */
  .soon-sec{background:radial-gradient(900px 500px at 15% 20%, #0F3A46 0%, var(--navy-0) 60%), var(--navy-0); color:var(--white);}
  .soon-card{display:flex; align-items:center; gap:44px; flex-wrap:wrap; justify-content:space-between; border:1px solid var(--line); border-radius:10px; padding:44px 46px; background:rgba(255,255,255,0.02);}
  .soon-left{max-width:520px;}
  .soon-badge{
    display:inline-flex; align-items:center; gap:8px; background:rgba(63,195,211,0.12); color:var(--ice);
    border:1px solid rgba(63,195,211,0.35); border-radius:999px; padding:6px 14px; font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:1.5px; margin-bottom:20px;
  }
  .soon-badge .dot2{width:6px; height:6px; border-radius:50%; background:var(--ice); animation:pulseDot 1.8s infinite;}
  .soon-left h2{font-family:'Fraunces', serif; font-weight:500; font-size:clamp(26px,3vw,36px); line-height:1.2;}
  .soon-left p{margin-top:16px; font-size:15.5px; line-height:1.7; color:var(--muted);}
  .soon-icon{width:120px; height:120px; border-radius:50%; border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; flex-shrink:0; position:relative;}
  .soon-icon::before{content:''; position:absolute; inset:16px; border-radius:50%; background:rgba(63,195,211,0.08);}
  .soon-icon svg{width:44px; height:44px; color:var(--ice); position:relative; z-index:1;}

  /* ---------- sermon ---------- */
  .sermon-sec{background:var(--navy-2);}
  .sermon-head{margin-bottom:40px;}
  .video-card{background:var(--navy-0); border-radius:8px; overflow:hidden; box-shadow:0 34px 70px -20px rgba(0,0,0,0.5); border:1px solid var(--line);}
